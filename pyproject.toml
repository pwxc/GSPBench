[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gspbench"
version = "0.0.1"
description = "Real-world graph signal datasets and reproducible GSP benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "pwxc" }]
keywords = [
  "graph signal processing",
  "graph datasets",
  "benchmarks",
  "weather",
  "machine learning",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
benchmarks = ["scikit-learn>=1.3"]
validation = ["pygsp>=0.5"]
test = [
  "pytest>=8",
  "scikit-learn>=1.3",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
  "scikit-learn>=1.3",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/pwxc/GSPBench"
Repository = "https://github.com/pwxc/GSPBench.git"
Issues = "https://github.com/pwxc/GSPBench/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gspbench = ["data/*.npz", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
